<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAM Dashboard</title>
  <link rel="stylesheet" href="/static/math.css">
  <script src="/static/crypto.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:      #07090f;
      --surface: rgba(255,255,255,0.04);
      --border:  rgba(255,255,255,0.07);
      --accent:  #6366f1;
      --adim:    rgba(99,102,241,0.14);
      --text:    #dde3ed;
      --muted:   #5e6a7e;
      --green:   #22c55e;
      --gdim:    rgba(34,197,94,0.14);
      color-scheme: dark;
    }
    @media (prefers-color-scheme: light) {
      :root:not([data-theme="dark"]) { --bg:#f5f7fb; --surface:rgba(15,23,42,.055); --border:rgba(15,23,42,.12); --text:#182235; --muted:#64748b; --adim:rgba(99,102,241,.12); color-scheme:light; }
      header, footer { background: color-mix(in srgb, var(--bg) 94%, transparent); }
      .msg-j { border-color:rgba(99,102,241,.2); }
    }
    :root[data-theme="dark"] { color-scheme:dark; }
    :root[data-theme="light"] { --bg:#f5f7fb; --surface:rgba(15,23,42,.055); --border:rgba(15,23,42,.12); --text:#182235; --muted:#64748b; --adim:rgba(99,102,241,.12); color-scheme:light; }
    html, body {
      height: 100%; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex; flex-direction: column; overflow: hidden;
    }

    /* ── HEADER ── */
    header {
      flex-shrink: 0; display: flex; align-items: center; gap: 10px;
      padding: 12px 16px; border-bottom: 1px solid var(--border);
      background: rgba(7,9,15,0.95);
    }
    .logo { font-size: 15px; font-weight: 700; letter-spacing: 6px; }
    .logo em { color: var(--accent); font-style: normal; }
    .pill {
      display: flex; align-items: center; gap: 6px; padding: 4px 11px;
      border-radius: 99px; background: var(--surface); border: 1px solid var(--border);
      font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase;
      color: var(--muted); transition: all 0.3s;
    }
    .pill.on { background: var(--gdim); border-color: rgba(34,197,94,0.3); color: var(--green); }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); transition: background 0.3s; }
    .pill.on .dot { background: var(--green); animation: blink 2s infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.4} }
    .spacer { flex: 1; }
    .enc-badge {
      font-size: 9px; font-weight: 700; letter-spacing: 1.5px; padding: 3px 8px;
      border-radius: 4px; display: none;
    }
    .enc-badge.on  { display: block; background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.25); color: var(--green); }
    .enc-badge.off { display: block; background: rgba(255,100,100,0.08); border: 1px solid rgba(255,100,100,0.2); color: #f87171; }
    .url { font-size: 10px; font-family: monospace; color: var(--muted); padding: 4px 9px; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; }
    .device-pill { font-size:10px; color:var(--muted); padding:4px 8px; border:1px solid var(--border); border-radius:8px; max-width:220px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

    /* ── FEED ── */
    main { flex: 1; overflow-y: auto; padding: 14px 16px 8px; display: flex; flex-direction: column; gap: 10px; }
    main::-webkit-scrollbar { width: 3px; }
    main::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    .msg { max-width: 82%; padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.55; animation: pop 0.18s ease; }
    @keyframes pop { from { opacity:0; transform:translateY(4px); } }
    .msg-j   { align-self:flex-start; background:var(--adim);   border:1px solid rgba(99,102,241,0.18); border-bottom-left-radius:4px; }
    .msg-u   { align-self:flex-end;   background:var(--surface); border:1px solid var(--border);        border-bottom-right-radius:4px; }
    .msg-sys { align-self:center; font-size:11px; color:var(--muted); padding:2px 0; background:transparent; border:none; letter-spacing:0.3px; }
    .lbl { font-size:9px; font-weight:700; letter-spacing:2px; text-transform:uppercase; opacity:0.45; margin-bottom:4px; }
    .msg-j .lbl { color:var(--accent); }
    .msg-u .lbl { color:var(--muted); text-align:right; }

    /* ── FILE CARD ── */
    .msg-file {
      align-self: flex-end;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; border-bottom-right-radius: 4px;
      padding: 11px 14px; display: flex; align-items: center; gap: 12px;
      max-width: 82%; animation: pop 0.18s ease;
    }
    .fc-icon { font-size: 26px; flex-shrink: 0; }
    .fc-meta { flex: 1; min-width: 0; }
    .fc-lbl  { font-size:9px; font-weight:700; letter-spacing:2px; text-transform:uppercase; opacity:0.45; color:var(--muted); margin-bottom:4px; }
    .fc-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .fc-size { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .fc-bar-wrap { height: 3px; background: var(--border); border-radius: 2px; margin-top: 7px; overflow: hidden; }
    .fc-bar { height: 100%; width: 0%; background: var(--accent); border-radius: 2px; transition: width 0.12s linear; }
    .fc-status { font-size: 10px; font-weight: 700; letter-spacing: 1px; flex-shrink: 0; color: var(--muted); }
    .fc-status.done { color: var(--green); }
    .fc-status.err  { color: #f87171; }
    .fc-dl { display:block; margin-top:6px; font-size:11px; color:var(--accent); text-decoration:none; font-weight:600; }
    .fc-dl:hover { opacity: 0.8; }

    /* ── FOOTER ── */
    footer { flex-shrink:0; padding:10px 14px; border-top:1px solid var(--border); background:rgba(7,9,15,0.95); display:flex; gap:8px; align-items:center; }
    #inp { flex:1; padding:11px 14px; background:var(--surface); border:1.5px solid var(--border); border-radius:12px; color:var(--text); font-size:14px; outline:none; transition:border-color 0.15s; }
    #inp:focus { border-color: var(--accent); }
    #inp::placeholder { color: var(--muted); }
    .btn { padding:11px 15px; border:none; border-radius:12px; font-size:11px; font-weight:700; letter-spacing:1.5px; cursor:pointer; transition:opacity 0.15s,transform 0.1s; }
    .btn:active { transform: scale(0.96); }
    .btn:hover  { opacity: 0.82; }
    .btn-send { background: var(--accent); color: #fff; }
    .btn-wake { background:var(--surface); border:1px solid var(--border); color:var(--muted); display:none; }
    .btn-wake.show { display:block; color:var(--green); border-color:rgba(34,197,94,0.35); }
    .btn-attach {
      background: var(--surface); border: 1px solid var(--border); color: var(--muted);
      padding: 11px 13px; font-size: 16px; line-height: 1; border-radius: 12px;
      cursor: pointer; transition: opacity 0.15s, transform 0.1s; display: flex;
      align-items: center; justify-content: center; flex-shrink: 0;
    }
    .btn-attach:hover  { opacity: 0.82; border-color: var(--accent); color: var(--accent); }
    .btn-attach:active { transform: scale(0.96); }
    .btn-camera { background:var(--surface); border:1px solid var(--border); color:var(--muted); padding:10px 12px; border-radius:12px; cursor:pointer; }
    .btn-camera:hover { border-color:var(--accent); color:var(--accent); }
    #camera-panel { display:none; position:fixed; z-index:4; right:14px; bottom:76px; width:min(360px,calc(100vw - 28px)); padding:10px; border:1px solid var(--border); border-radius:14px; background:var(--bg); box-shadow:0 12px 36px #0004; }
    #camera-panel.show { display:block; }
    #camera-preview { display:block; width:100%; max-height:240px; object-fit:cover; border-radius:9px; background:#111; }
    .camera-actions { display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; }
    .camera-actions button { flex:1; }
    .extras { display:none; flex-shrink:0; align-items:center; flex-wrap:wrap; gap:8px; padding:10px 14px; border-top:1px solid var(--border); background:var(--bg); }
    .extras.show { display:flex; }
    .extras button,.extras select,.extras input[type=text] { background:var(--surface); color:var(--text); border:1px solid var(--border); border-radius:9px; padding:8px 10px; }
    .extras button { cursor:pointer; }
    .extras button.active { color:var(--accent); border-color:var(--accent); }
    .extras label { color:var(--muted); font-size:12px; display:flex; align-items:center; gap:6px; }
    #photo-editor,#video-editor { display:none; margin-top:8px; }
    #photo-editor.show,#video-editor.show { display:block; }
    #photo-edit-preview,#video-edit-preview { max-width:100%; max-height:220px; display:block; margin:auto; border-radius:8px; }
    .edit-row { display:flex; align-items:center; gap:7px; color:var(--muted); font-size:11px; margin-top:6px; }
    .edit-row input[type=range] { flex:1; }
    .edit-row input[type=number] { width:70px; }
    .camera-help { color:var(--muted); font-size:11px; margin-top:6px; }
    @media (max-width:600px) { header {padding:10px 12px;} .url {display:none;} footer {gap:5px;padding:8px;} .btn {padding:11px 10px;} #inp {min-width:0;} .msg {max-width:92%;} }
    @media (min-width:1000px) { main {padding:22px max(24px,calc((100vw - 900px)/2));} footer {padding:12px max(20px,calc((100vw - 900px)/2));} }
    :root[data-low-power="true"] main { scroll-behavior:auto; }
    :root[data-low-power="true"] *, :root[data-low-power="true"] *::before, :root[data-low-power="true"] *::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; scroll-behavior:auto !important; }

    /* ── MIC BUTTON ── */
    #mic-btn {
      background: var(--surface); border: 1px solid var(--border); color: var(--muted);
      padding: 11px 13px; font-size: 16px; line-height: 1; border-radius: 12px;
      cursor: pointer; transition: opacity 0.15s, transform 0.1s, background 0.2s, border-color 0.2s;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    #mic-btn:hover  { opacity: 0.82; border-color: var(--accent); color: var(--accent); }
    #mic-btn:active { transform: scale(0.96); }
    #mic-btn.recording {
      background: rgba(239,68,68,0.15); border-color: rgba(239,68,68,0.45); color: #ef4444;
      animation: mic-pulse 1s ease-in-out infinite;
    }
    #mic-btn.unsupported { opacity: 0.3; cursor: not-allowed; }
    @keyframes mic-pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.65;transform:scale(0.97)} }

    /* ── TOAST ── */
    #toast {
      position:fixed; top:66px; left:50%; transform:translateX(-50%) translateY(-8px);
      background:rgba(34,197,94,0.16); border:1px solid rgba(34,197,94,0.4);
      color:var(--green); font-size:12px; font-weight:700; letter-spacing:1px;
      padding:7px 18px; border-radius:99px;
      opacity:0; transition:opacity 0.22s,transform 0.22s;
      pointer-events:none; white-space:nowrap;
    }
    #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  </style>
</head>
<body>
  <div id="toast"></div>
  <header>
    <div class="logo"><em>J</em>ARVIS</div>
    <div class="pill" id="pill"><span class="dot"></span><span id="st">Connecting</span></div>
    <div class="enc-badge" id="enc">AES-256</div>
    <div class="spacer"></div>
    <div class="device-pill" id="device-pill">Detecting device…</div>
    <div class="url">__IP__:__PORT__</div>
  </header>
  <main id="feed"></main>
  <section id="camera-panel" aria-label="Camera tools">
    <video id="camera-preview" autoplay playsinline muted></video>
    <div class="camera-actions">
      <button onclick="capturePhoto()">PHOTO</button><button id="video-record-btn" onclick="startVideoRecording()">RECORD VIDEO WITH SOUND</button><button onclick="stopVideoRecording()">STOP VIDEO</button>
      <button class="btn btn-send" onclick="analyzeCamera()">ASK ABOUT FRAME</button><button onclick="stopCamera()">CLOSE CAMERA</button>
    </div>
    <div id="photo-editor">
      <img id="photo-edit-preview" alt="Photo preview">
      <div class="edit-row">Brightness <input id="photo-brightness" type="range" min="50" max="150" value="100" oninput="updatePhotoPreview()"></div>
      <div class="edit-row">Contrast <input id="photo-contrast" type="range" min="50" max="150" value="100" oninput="updatePhotoPreview()"></div>
      <div class="edit-row">Saturation <input id="photo-saturation" type="range" min="0" max="200" value="100" oninput="updatePhotoPreview()"></div>
      <div class="camera-actions"><button onclick="saveEditedPhoto()">SAVE EDITED PHOTO</button></div>
    </div>
    <div id="video-editor">
      <video id="video-edit-preview" controls playsinline></video>
      <div class="edit-row">Trim from <input id="video-trim-start" type="number" min="0" step="0.1" value="0"> to <input id="video-trim-end" type="number" min="0" step="0.1" value="0"> seconds</div>
      <div class="camera-actions"><button onclick="saveTrimmedVideo()">EXPORT TRIMMED VIDEO</button></div>
    </div>
    <label class="camera-help"><input id="video-sound-enabled" type="checkbox" checked> Include microphone sound in video</label>
    <div class="camera-help">Voice-only recording saves microphone audio as a separate file. Video sound is enabled by default; your browser will ask for microphone access.</div>
  </section>
  <div class="extras" id="extras-panel">
    <button type="button" title="Live web search is included automatically">Web search: on</button>
    <button onclick="document.getElementById('folder-inp').click()">Choose folder</button>
    <button onclick="document.getElementById('audio-inp').click()">Choose audio</button>
    <button id="audio-record-btn" onclick="toggleAudioRecording()">Record voice only</button>
    <button onclick="toggleCamera()">Camera / video</button>
    <label>What do you prefer to be called? <select id="salutation"><option>Ma'am</option><option>Sir</option><option>Other</option></select></label>
    <input id="other-name" type="text" maxlength="80" placeholder="Enter the name to use" style="display:none;width:140px">
    <label><input id="auto-bionic" type="checkbox"> Open Bionic with dashboard</label>
    <button onclick="showSavedHistory()">Recent history</button>
  </div>
  <footer>
    <button class="btn-camera" id="extras-toggle" onclick="toggleExtras()" title="Toggle extra inputs">＋</button>
    <button class="btn-camera" onclick="toggleCamera()" title="Open camera and video tools">📷</button>
    <button class="btn-camera" id="audio-record-btn-main" onclick="toggleAudioRecording()" title="Record voice only as an audio file">🎙 Voice only</button>
    <button class="btn-camera" id="speech-toggle" onclick="toggleSpeech()" title="Toggle spoken replies">🔊</button>
    <input id="inp" placeholder="Ask SAM anything…" autocomplete="off">
    <label class="btn-attach" for="file-inp" title="Send file">📎</label>
    <input type="file" id="file-inp" multiple accept="*/*" style="display:none">
    <input type="file" id="folder-inp" webkitdirectory directory multiple style="display:none">
    <input type="file" id="audio-inp" accept="audio/*" multiple style="display:none">
    <button id="mic-btn" onclick="doMic()" title="Voice command">🎤</button>
    <button class="btn btn-wake" id="wake" onclick="doWake()">WAKE</button>
    <button class="btn btn-send" onclick="doSend()">SEND</button>
  </footer>

  <script>
    // Adapt layout to this browser/device. Browsers do not expose the device's
    // GPU model or display brightness; hardware hints and ambient light are best effort.
    const root = document.documentElement;
    const themePref = window.matchMedia('(prefers-color-scheme: dark)');
    function applyTheme() { if (!root.dataset.theme) root.style.colorScheme = themePref.matches ? 'dark' : 'light'; }
    applyTheme(); themePref.addEventListener?.('change', applyTheme);
    const ua = navigator.userAgent || '';
    root.dataset.os = /Mac|iPhone|iPad/.test(ua) ? 'apple' : /Win/.test(ua) ? 'windows' : /Linux|Android/.test(ua) ? 'linux' : 'other';
    let hasGpu = false;
    try { const canvas = document.createElement('canvas'); hasGpu = !!(canvas.getContext('webgl') || canvas.getContext('experimental-webgl')); } catch (_) {}
    root.dataset.gpu = String(hasGpu);
    root.dataset.lowPower = String(!hasGpu || (navigator.deviceMemory && navigator.deviceMemory <= 4) || (navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 4));
    try { if ('AmbientLightSensor' in window) { const light = new AmbientLightSensor(); light.onreading = () => { if (!root.dataset.theme) root.style.filter = light.illuminance < 15 ? 'brightness(.92)' : ''; }; light.start(); } } catch (_) {}

    // ── Auth — bearer token ───────────────────────────────────────────────────
    const _authToken  = sessionStorage.getItem('sam_token');
    const _sessionKey = sessionStorage.getItem('sam_key');

    if (!_authToken) {
      location.replace('/login');
    }

    function _authHeader() { return { 'Authorization': `Bearer ${_authToken}` }; }
    function _authFetch(url, opts = {}) {
      opts.headers = Object.assign({}, opts.headers, _authHeader());
      return fetch(url, opts);
    }

    // ── AES-256-CBC encryption (CryptoJS) ────────────────────────────────────
    const _AES_SALT = 'SAM-DASHBOARD-v1';
    let _aesKey = null;

    function _initCrypto(key) {
      if (typeof CryptoJS === 'undefined') return false;
      _aesKey = CryptoJS.SHA256(key + _AES_SALT);
      return true;
    }

    function _encrypt(plaintext) {
      if (!_aesKey || typeof CryptoJS === 'undefined') return null;
      try {
        const iv  = CryptoJS.lib.WordArray.random(16);
        const enc = CryptoJS.AES.encrypt(
          CryptoJS.enc.Utf8.parse(plaintext), _aesKey,
          { iv, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7 }
        );
        const ivHex = iv.toString(CryptoJS.enc.Hex);
        const ctHex = enc.ciphertext.toString(CryptoJS.enc.Hex);
        const hex   = ivHex + ctHex;
        const bytes = new Uint8Array(hex.length / 2);
        for (let i = 0; i < bytes.length; i++)
          bytes[i] = parseInt(hex.substr(i * 2, 2), 16);
        return btoa(String.fromCharCode(...bytes));
      } catch { return null; }
    }

    const _encReady = _sessionKey ? _initCrypto(_sessionKey) : false;
    const encBadge  = document.getElementById('enc');
    if (_encReady) { encBadge.className = 'enc-badge on'; }
    else           { encBadge.className = 'enc-badge off'; encBadge.textContent = 'NO ENC'; }

    // ── WebSocket ─────────────────────────────────────────────────────────────
    const feed  = document.getElementById('feed');
    const pill  = document.getElementById('pill');
    const stTxt = document.getElementById('st');
    const wake  = document.getElementById('wake');

    const _wsProto = location.protocol === 'https:' ? 'wss' : 'ws';
    const _wsUrl   = `${_wsProto}://${location.host}/ws?token=${encodeURIComponent(_authToken)}`;
    const ws       = new WebSocket(_wsUrl);

    ws.onopen    = () => { sys('Remote session active.'); toast('Connected to SAM'); };
    ws.onclose   = () => sys('Connection lost — refresh to reconnect.');
    ws.onerror   = () => sys('Connection error.');
    ws.onmessage = (e) => {
      const m = JSON.parse(e.data);
      if (m.type === 'log')           append(m.speaker, m.text);
      if (m.type === 'status')        setStatus(m.state);
      if (m.type === 'wake')          sys('Wake word detected — connecting…');
      if (m.type === 'sys')           sys(m.text);
      if (m.type === 'file_received') _onFileReceived(m);
    };

    function setStatus(s) {
      if (s === 'active') {
        pill.className = 'pill on'; stTxt.textContent = 'Active'; wake.classList.remove('show');
      } else {
        pill.className = 'pill'; stTxt.textContent = 'Sleeping'; wake.classList.add('show');
      }
    }

    function append(speaker, text) {
      const d = document.createElement('div');
      if (speaker === 'sam') {
        d.className = 'msg msg-j';
        d.innerHTML = `<div class="lbl">Sam</div>${esc(text)}`;
      } else {
        d.className = 'msg msg-u';
        d.innerHTML = `<div class="lbl">You</div>${esc(text)}`;
      }
      feed.appendChild(d);
      feed.scrollTop = feed.scrollHeight;
    }

    function appendSources(sources) {
      if (!Array.isArray(sources) || !sources.length) return;
      const group = document.createElement('div');
      group.className = 'msg msg-j';
      const label = document.createElement('div'); label.className = 'lbl'; label.textContent = 'Web findings'; group.appendChild(label);
      for (const source of sources) {
        const card = document.createElement('div');
        card.style.cssText = 'padding:9px 0;border-top:1px solid var(--line,rgba(255,255,255,.12));';
        const title = document.createElement('div'); title.style.fontWeight = '600'; title.textContent = source.title || 'Web page'; card.appendChild(title);
        const body = document.createElement('div'); body.style.marginTop = '4px'; body.textContent = source.content || source.snippet || 'No readable page text was available.'; card.appendChild(body);
        try {
          const url = new URL(source.url);
          if (['http:', 'https:'].includes(url.protocol)) {
            const link = document.createElement('a'); link.href = url.href; link.target = '_blank'; link.rel = 'noopener noreferrer'; link.textContent = 'Open source';
            link.style.cssText = 'display:inline-block;margin-top:5px;color:var(--accent,#6ba8ff)'; card.appendChild(link);
          }
        } catch (_) {}
        group.appendChild(card);
      }
      feed.appendChild(group); feed.scrollTop = feed.scrollHeight;
    }

    function sys(text) {
      const d = document.createElement('div');
      d.className = 'msg msg-sys'; d.textContent = text;
      feed.appendChild(d); feed.scrollTop = feed.scrollHeight;
    }

    function esc(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    // ── File helpers ──────────────────────────────────────────────────────────
    function _fileIcon(name) {
      const ext = (name.split('.').pop() || '').toLowerCase();
      if (['jpg','jpeg','png','gif','webp','heic','heif','avif','bmp','svg'].includes(ext)) return '🖼️';
      if (['mp4','mov','avi','mkv','webm','m4v','3gp'].includes(ext))                       return '🎬';
      if (['mp3','m4a','wav','flac','aac','ogg','opus'].includes(ext))                      return '🎵';
      if (['pdf'].includes(ext))                                                             return '📋';
      if (['doc','docx','txt','md','rtf','odt'].includes(ext))                              return '📝';
      if (['xls','xlsx','csv','ods'].includes(ext))                                         return '📊';
      if (['ppt','pptx','odp'].includes(ext))                                               return '📑';

    function _uploadFile(file, relativePath = '') {
      const id = 'fc_' + Date.now() + '_' + Math.random().toString(36).slice(2);

      // Create file card in feed
      const card = document.createElement('div');
      card.className = 'msg-file';

      card.innerHTML = `
        <div class="fc-icon">${_fileIcon(file.name)}</div>

        </div>
        <div class="fc-status" id="${id}_st">0%</div>
      `;
      feed.appendChild(card);
      feed.scrollTop = feed.scrollHeight;

      const xhr = new XMLHttpRequest();
      xhr.open('POST', '/api/upload');
      xhr.setRequestHeader('Authorization', `Bearer ${_authToken}`);

      xhr.upload.onprogress = (e) => {
        if (!e.lengthComputable) return;
        const pct = Math.round(e.loaded / e.total * 100);
        const bar = document.getElementById(`${id}_bar`);
        const st  = document.getElementById(`${id}_st`);
        if (bar) bar.style.width = pct + '%';
        if (st)  st.textContent  = pct + '%';
      };

      xhr.onload = () => {
        const bar  = document.getElementById(`${id}_bar`);
        const st   = document.getElementById(`${id}_st`);
        const meta = card.querySelector('.fc-meta');
        const lbl  = card.querySelector('.fc-lbl');
        if (xhr.status === 200) {
          let savedName = file.name;
          try { const saved = JSON.parse(xhr.responseText); savedName = saved.path || saved.name || file.name; } catch {}
          const dlUrl = `/uploads/${savedName.split('/').map(encodeURIComponent).join('/')}?token=${encodeURIComponent(_authToken)}`;
          if (bar)  { bar.style.width = '100%'; bar.style.background = 'var(--green)'; }
          if (st)   { st.textContent = '✓'; st.className = 'fc-status done'; }
          if (lbl)  lbl.textContent = 'Sent';
          if (meta) meta.insertAdjacentHTML('beforeend',
            `<a class="fc-dl" href="${dlUrl}" download="${esc(savedName)}">⬇ Download back</a>`);
          toast('File sent!');
        } else {
          let errMsg = 'Upload failed';
          try { errMsg = JSON.parse(xhr.responseText).error || errMsg; } catch {}
          if (bar) bar.style.background = '#f87171';
          if (st)  { st.textContent = 'ERR'; st.className = 'fc-status err'; }
          if (lbl) lbl.textContent = errMsg;
        }
      };

      xhr.onerror = () => {
        const st  = document.getElementById(`${id}_st`);
        const lbl = card.querySelector('.fc-lbl');
        if (st)  { st.textContent = 'ERR'; st.className = 'fc-status err'; }
        if (lbl) lbl.textContent = 'Connection error';
      };

      const fd = new FormData();
      fd.append('file', file);
      if (relativePath) fd.append('relative_path', relativePath);
      xhr.send(fd);
    }

    // Float32 PCM → resample to 16 kHz + convert to Int16
    function _f32toPcm16(f32, srcRate) {
      let s = f32;
      if (srcRate !== 16000) {
        const ratio = srcRate / 16000;
        const len   = Math.round(f32.length / ratio);
        s = new Float32Array(len);
        for (let i = 0; i < len; i++)
          s[i] = f32[Math.min(Math.round(i * ratio), f32.length - 1)];
      }
      const out = new Int16Array(s.length);
      for (let i = 0; i < s.length; i++)
        out[i] = Math.max(-32768, Math.min(32767, Math.round(s[i] * 32768)));
      return out.buffer;
    }

    async function doMic() {
      if (_voiceWs) { _stopVoice(); return; }

      if (!navigator.mediaDevices?.getUserMedia) {
        _showVoiceSetup();
        return;
      }
      let stream;
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true },
        });
      } catch (e) {
        sys(e.name === 'NotAllowedError'
          ? 'Microphone denied — tap the address bar lock and allow microphone.'
          : 'Mic error: ' + e.message);
        return;
      }

      // 16 kHz context (fall back to native rate — _f32toPcm16 resamples)
      let ctx;
      try { ctx = new AudioContext({ sampleRate: 16000 }); }
      catch (_) { ctx = new AudioContext(); }
      if (ctx.state === 'suspended') await ctx.resume();

      const wsProto = location.protocol === 'https:' ? 'wss' : 'ws';
      const ws = new WebSocket(
        `${wsProto}://${location.host}/ws/phone-audio?token=${encodeURIComponent(_authToken)}`
      );
      ws.binaryType = 'arraybuffer';

      ws.onopen = async () => {
        const rate = ctx.sampleRate;
        const src  = ctx.createMediaStreamSource(stream);

        // AudioWorklet (modern) — runs in dedicated audio thread
        const wCode = `class J extends AudioWorkletProcessor{process(i){const c=i[0]?.[0];if(c)this.port.postMessage(c.slice());return true;}}registerProcessor('j',J);`;
        try {
          const burl = URL.createObjectURL(new Blob([wCode], { type: 'application/javascript' }));
          await ctx.audioWorklet.addModule(burl);
          URL.revokeObjectURL(burl);
          const nd = new AudioWorkletNode(ctx, 'j');
          // Buffer to 1024 samples (64 ms at 16 kHz) before sending —
          // matches PC mic chunk size, prevents queue flooding on the server.
          let _pbuf = [], _plen = 0;
          nd.port.onmessage = e => {
            const chunk = new Int16Array(_f32toPcm16(e.data, rate));
            _pbuf.push(chunk); _plen += chunk.length;
            if (_plen >= 1024) {
              const out = new Int16Array(_plen); let off = 0;
              for (const c of _pbuf) { out.set(c, off); off += c.length; }
              if (ws.readyState === 1) ws.send(out.buffer);
              _pbuf = []; _plen = 0;
            }
          };
          src.connect(nd);
          _audioNd = nd;
        } catch (_) {
          // ScriptProcessor fallback (deprecated, still works everywhere)
          const sp = ctx.createScriptProcessor(4096, 1, 1);
          sp.onaudioprocess = e => {
            if (ws.readyState === 1) ws.send(_f32toPcm16(e.inputBuffer.getChannelData(0), rate));
          };
          src.connect(sp); sp.connect(ctx.destination);
          _audioNd = sp;
        }

        micBtn.innerHTML = '⏹';
        micBtn.title     = 'Tap to stop';
        micBtn.classList.add('recording');
        sys('Voice live — speak now');
        toast('🎤 Live');
      };

      ws.onclose = () => { _stopVoice(); };
      ws.onerror = () => { sys('Voice connection failed.'); _stopVoice(); };

      _voiceWs  = ws;
      _audioCtx = ctx;
      _micStm   = stream;
    }

    function _stopVoice() {
      if (_audioNd)  { try { _audioNd.disconnect(); }  catch (_) {}; _audioNd  = null; }
      if (_audioCtx) { try { _audioCtx.close(); }      catch (_) {}; _audioCtx = null; }
      if (_micStm)   { _micStm.getTracks().forEach(t => t.stop()); _micStm = null; }
      if (_voiceWs)  {
        const w = _voiceWs; _voiceWs = null;
        if (w.readyState < 2) w.close();
      }
      _micIdle();
    }
  </script>
</body>
</html>
